<!doctype html><html lang="en"><meta charset="utf-8"><title>Payment Plan Generator</title><style>body{font:16px Arial;background:#121b2b;color:#eee;max-width:850px;margin:30px auto;padding:15px}input,textarea{padding:9px;margin:5px;width:95%;box-sizing:border-box}label{display:block;margin:10px 0}button{padding:12px;background:#3678da;color:white;border:0;border-radius:5px;cursor:pointer;margin:5px}.panel{background:#223047;padding:20px;border-radius:10px;margin:15px 0}table{width:100%;border-collapse:collapse}td,th{border:1px solid #888;padding:7px}td input{width:95%}#document{background:white;color:black;padding:35px;line-height:1.5}#document p{color:black}.sign{margin-top:55px;display:flex;justify-content:space-between}@media print{body{background:white;margin:0;max-width:none}.editor{display:none}#document{padding:0}.panel{padding:0;background:white}@page{margin:0.7in}}</style><div class="editor"><h1>UtilityHub — Payment Plan Generator</h1><p>Enter resident information, build a payment schedule, then print or save as PDF. Information stays in this browser.</p><div class="panel"><label>Property <input id="property" value="Essex Village & Marlyn Gardens"></label><label>Resident name <input id="resident"></label><label>Unit / Apartment <input id="unit"></label><label>Property address <input id="address"></label><label>Agreement date <input type="date" id="date"></label><label>Total amount ($) <input type="number" step=".01" min=".01" id="total" value="2934.95"></label><label>Number of payments <input type="number" min="1" max="24" id="count" value="4"></label><label>First due date <input type="date" id="first" value="2026-11-20"></label><label>Balance covers <textarea id="covered">November 2026 outstanding balance and December 2026 rent.</textarea></label><label>Not included <textarea id="excluded">January 2027 rent must be paid separately.</textarea></label><button onclick="generate()">Generate equal installments</button><button onclick="addRow()">Add payment</button></div><div class="panel"><h3>Editable payment schedule</h3><table><thead><tr><th>Due date</th><th>Amount ($)</th><th></th></tr></thead><tbody id="rows"></tbody></table><p id="check"></p><button onclick="preview()">Preview agreement</button><button onclick="if(preview())print()">Print / Save PDF</button></div></div><div id="document"></div><script>
const el=id=>document.getElementById(id),val=id=>el(id).value,esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),money=n=>(n/100).toLocaleString('en-US',{style:'currency',currency:'USD'}),cent=s=>Math.round(Number(s)*100);
function addRow(date='',amount=''){let r=document.createElement('tr');r.innerHTML='<td><input type="date" class="due"></td><td><input type="number" step=".01" min=".01" class="amount"></td><td><button type="button">Remove</button></td>';r.querySelector('.due').value=date;r.querySelector('.amount').value=amount;r.querySelector('button').onclick=()=>{r.remove();check()};r.querySelectorAll('input').forEach(x=>x.oninput=check);el('rows').append(r);check()}
function entries(){return [...el('rows').children].map(r=>({date:r.querySelector('.due').value,amount:cent(r.querySelector('.amount').value)}))}
function check(){let t=cent(val('total')),e=entries(),s=e.reduce((a,x)=>a+x.amount,0),ok=t>0&&e.length>0&&e.every(x=>x.date&&x.amount>0)&&s===t;el('check').textContent='Scheduled: '+money(s)+' / Total: '+money(t)+(ok?' — Balanced':' — Please correct amounts/dates');return ok}
function generate(){let n=Number(val('count')),t=cent(val('total')),first=val('first');if(!Number.isInteger(n)||n<1||n>24||t<=0||!first){alert('Enter a valid total, 1–24 payments, and first date.');return}el('rows').innerHTML='';let base=Math.floor(t/n);for(let i=0;i<n;i++){let d=new Date(first+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+i*7);addRow(d.toISOString().slice(0,10),((i===n-1?t-base*(n-1):base)/100).toFixed(2))}preview()}
function preview(){if(!check()){alert('Payment amounts must equal the total, with valid dates.');return false}let e=entries(),t=cent(val('total'));el('document').innerHTML='<h2 style="text-align:center">PAYMENT PLAN AGREEMENT</h2><p><b>Agreement date:</b> '+esc(val('date'))+'<br><b>Property:</b> '+esc(val('property'))+'<br><b>Address:</b> '+esc(val('address'))+'<br><b>Resident:</b> '+esc(val('resident'))+'<br><b>Apartment:</b> '+esc(val('unit'))+'</p><p>This agreement covers <b>'+money(t)+'</b> for: '+esc(val('covered'))+'</p><table><tr><th>Payment</th><th>Due date</th><th>Amount</th></tr>'+e.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.date)+'</td><td>'+money(x.amount)+'</td></tr>').join('')+'<tr><th colspan="2">Total</th><th>'+money(t)+'</th></tr></table><p><b>Excluded amounts:</b> '+esc(val('excluded'))+'</p><p>The resident agrees to make the payments on the dates shown. If a payment cannot be made, the resident should promptly contact management. Any modification must be agreed to in writing.</p><p>If payments are missed, management may exercise rights available under the lease and applicable Maryland law, subject to legally required notices and court procedures. Nothing here waives rights that cannot lawfully be waived.</p><p>Once all payments are received, the balance covered by this agreement will be satisfied, subject to any lawful adjustments. Other rent and charges remain due separately.</p><div class="sign"><span>_________________________<br>Resident signature / Date</span><span>_________________________<br>Management signature / Date</span></div><p style="margin-top:35px;font-size:12px">Draft template: verify lease terms, balances and applicable law before use.</p>';return true}
el('date').value=new Date().toLocaleDateString('en-CA');el('total').oninput=check;generate();
</script></html>
